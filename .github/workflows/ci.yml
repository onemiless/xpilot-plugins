name: plugin checks

on:
  pull_request:
  push:
    branches: [main, task/X-20261025-42]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      X: ${{ github.workspace }}/xpilot
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: onemiless/xpilot
        ref: xpilot
        path: xpilot
    - run: git -C xpilot submodule update --init --depth 1 msgq_repo tinygrad_repo opendbc_repo
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pyzmq numpy pycapnp pytest zstandard setproctitle cython scons setuptools cffi tqdm jeepney av comma-deps-raylib pyyaml
    - name: Build msgq
      working-directory: xpilot/msgq_repo
      run: scons -j4 msgq/ipc_pyx.so msgq/visionipc/visionipc_pyx.so
    - name: Classifier failure modes
      run: python3 tools/pr_risk_check.py > /tmp/pr_risk_check.json
    - name: Archives and index match the source
      run: python3 tools/build_index.py --check
    - name: Runtime rules match the host and reference tables
      run: PYTHONPATH=$X:$X/tinygrad_repo:$X/msgq_repo:$X/opendbc_repo python3 tools/runtime_rules_check.py --output /tmp/runtime-rules
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: runtime-rules
        path: /tmp/runtime-rules
    - name: Starlink synthetic network contract
      run: python3 plugins/starlink/tests/contract_e2e.py
    - name: Plugin tests
      working-directory: plugins
      run: PYTHONPATH=$X:$X/tinygrad_repo:$X/msgq_repo:$X/opendbc_repo python3 -m pytest -q -p no:cacheprovider .
    - name: Store end to end (install, discover, enable)
      run: |
        PYTHONPATH=$X:$X/tinygrad_repo:$X/msgq_repo:$X/opendbc_repo python3 - --repo . <<'PY'
        import importlib.util, os, sys
        spec = importlib.util.spec_from_file_location('catalog', os.environ['X'] + '/tools/sp_tesla_e2e/store_e2e.py')
        catalog = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(catalog)
        sys.modules['openpilot.common.params'].Params = catalog.CoreParams
        fetch = catalog.store.fetch_index
        def compatible_catalog(*args):
          entries, error = fetch(*args)
          return [e for e in entries if catalog.mf.platform_ok(e.platform)], error
        catalog.store.fetch_index = compatible_catalog
        raise SystemExit(catalog.main())
        PY
    - name: Tell the owner main is broken
      if: failure() && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue create --title "main checks failed at ${GITHUB_SHA::10}" --body "@onemiless $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
