name: plugin checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      X: ${{ github.workspace }}/xpilot
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: onemiless/xpilot
        ref: 3bd5f259cd772e9d60bf0f4dcde197eb1f9b8665
        path: xpilot
    - run: git -C xpilot submodule update --init --depth 1 msgq_repo
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pyzmq numpy pycapnp pytest zstandard setproctitle cython scons setuptools
    - name: Build msgq
      working-directory: xpilot/msgq_repo
      run: scons -j4 msgq/ipc_pyx.so
    - name: Classifier failure modes
      run: python3 tools/pr_risk_check.py > /tmp/pr_risk_check.json
    - name: Archives and index match the source
      run: python3 tools/build_index.py --check
    - name: Runtime rules match the host and reference tables
      run: PYTHONPATH=$X:$X/msgq_repo:$X/opendbc_repo python3 tools/runtime_rules_check.py --output /tmp/runtime-rules
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: runtime-rules
        path: /tmp/runtime-rules
    - name: Plugin tests
      working-directory: plugins
      run: PYTHONPATH=$X:$X/msgq_repo:$X/opendbc_repo python3 -m pytest -q -p no:cacheprovider .
    - name: Store end to end (install, discover, enable)
      run: PYTHONPATH=$X/msgq_repo python3 $X/tools/sp_tesla_e2e/store_e2e.py --repo .
    - name: Tell the owner main is broken
      if: failure() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue create --title "main checks failed at ${GITHUB_SHA::10}" --body "@onemiless $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
